settings:
  # Require sneak to activate?
  require-sneak: true
  # Maximum blocks that can be broken at once (Safety Limit)
  # Used as fallback when per-tier tool config is disabled
  max-blocks: 64
  # Cooldown delay after usage (in ticks)
  cooldown: 10
  # Show preview particles?
  preview-particles: true
  # Activation mode: sneak | toggle | hold
  # sneak: classic sneak + break
  # toggle: player toggles with /sh toggle, then breaks normally
  # hold: hold sneak for N ticks, then activation is on until release
  activation-mode: "sneak"
  hold-ticks: 10

# VeinMiner Configuration
veinminer:
  enabled: true
  # Allowed tools
  allowed-tools:
    - WOODEN_PICKAXE
    - STONE_PICKAXE
    - IRON_PICKAXE
    - GOLDEN_PICKAXE
    - DIAMOND_PICKAXE
    - NETHERITE_PICKAXE
  # Valid blocks for vein mining
  valid-blocks:
    - COAL_ORE
    - IRON_ORE
    - GOLD_ORE
    - DIAMOND_ORE
    - REDSTONE_ORE
    - LAPIS_ORE
    - EMERALD_ORE
    - NETHER_QUARTZ_ORE
    - ANCIENT_DEBRIS
    - COPPER_ORE
    - DEEPSLATE_COAL_ORE
    - DEEPSLATE_IRON_ORE
    - DEEPSLATE_GOLD_ORE
    - DEEPSLATE_DIAMOND_ORE
    - DEEPSLATE_REDSTONE_ORE
    - DEEPSLATE_LAPIS_ORE
    - DEEPSLATE_EMERALD_ORE
    - DEEPSLATE_COPPER_ORE
    - GLOWSTONE
  # Scan mode: cardinal (6 directions) | diagonal (26 directions)
  scan-mode: "cardinal"
  # Enchantment support
  honor-fortune: true
  honor-silk-touch: true
  # Cap fortune multiplier to prevent OP drops (0 = unlimited)
  max-fortune-multiplier: 3.0
  # Per-tool tier settings (max-blocks override, durability & cooldown multiplier)
  # Set use-tiers: true to enable. Falls back to settings.max-blocks if disabled.
  use-tiers: false
  tool-tiers:
    WOODEN_PICKAXE:
      max-blocks: 8
      durability-multiplier: 1.5
      cooldown-multiplier: 2.0
    STONE_PICKAXE:
      max-blocks: 16
      durability-multiplier: 1.2
      cooldown-multiplier: 1.5
    IRON_PICKAXE:
      max-blocks: 32
      durability-multiplier: 1.0
      cooldown-multiplier: 1.0
    GOLDEN_PICKAXE:
      max-blocks: 16
      durability-multiplier: 2.0
      cooldown-multiplier: 1.5
    DIAMOND_PICKAXE:
      max-blocks: 64
      durability-multiplier: 0.8
      cooldown-multiplier: 0.8
    NETHERITE_PICKAXE:
      max-blocks: 128
      durability-multiplier: 0.6
      cooldown-multiplier: 0.5

# Timber Configuration
timber:
  enabled: true
  allowed-tools:
    - WOODEN_AXE
    - STONE_AXE
    - IRON_AXE
    - GOLDEN_AXE
    - DIAMOND_AXE
    - NETHERITE_AXE
  # Break leaves when chopping trees?
  break-leaves: true
  # Pale Oak is included in the built-in timber material list.
  # Require sapling to chop tree? (Optional)
  require-sapling: false
  # Tree detection: strict (trunk-based, anti-bleed) | loose (original BFS)
  detection: "strict"
  # Max horizontal radius from trunk to consider as same tree (for strict mode)
  max-horizontal-radius: 2
  # Per-tool tier settings
  use-tiers: false
  tool-tiers:
    WOODEN_AXE:
      max-blocks: 16
      durability-multiplier: 1.5
      cooldown-multiplier: 2.0
    STONE_AXE:
      max-blocks: 32
      durability-multiplier: 1.2
      cooldown-multiplier: 1.5
    IRON_AXE:
      max-blocks: 64
      durability-multiplier: 1.0
      cooldown-multiplier: 1.0
    GOLDEN_AXE:
      max-blocks: 32
      durability-multiplier: 2.0
      cooldown-multiplier: 1.5
    DIAMOND_AXE:
      max-blocks: 128
      durability-multiplier: 0.8
      cooldown-multiplier: 0.8
    NETHERITE_AXE:
      max-blocks: 256
      durability-multiplier: 0.6
      cooldown-multiplier: 0.5

# Animation settings for block breaking
animation:
  enabled: true
  # Number of blocks to break per tick (higher = faster, more laggy)
  blocks-per-tick: 4
  # Style: ripple (from player outward) | wave (bottom-up) | random
  style: "ripple"

# World Configuration
worlds:
  # Worlds where features are disabled
  blacklist:
    - world_nether
    - world_the_end
